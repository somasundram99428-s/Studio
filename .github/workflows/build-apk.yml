name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Get face-detection files
        run: |
          pip install opencv-python-headless
          python -c "import cv2,shutil,os;d=cv2.data.haarcascades;[shutil.copy(d+n,n) for n in ('haarcascade_frontalface_default.xml','haarcascade_frontalface_alt2.xml','haarcascade_eye.xml')]"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - run: pip install buildozer cython==0.29.36
      - run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: DeluxeDigitalStudio-apk
          path: bin/*.apk
